name: core-nav-ship

on:
  pull_request:
    branches: [main]
    paths:
      - 'core-nav/**'
      - '.github/workflows/core-nav-ship.yml'
  push:
    branches: [main]
    paths:
      - 'core-nav/**'
      - '.github/workflows/core-nav-ship.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Not applicable to this sub-project — admin-ship.yml owns the real e2e-and-a11y job
  # (admin-web a11y/e2e coverage, see issue #335). Required by branch protection
  # alongside quality-gate on every PR; this no-op lets PRs that don't touch admin-web
  # satisfy that requirement instead of blocking forever on a check that never runs.
  e2e-and-a11y:
    runs-on: ubuntu-latest
    steps:
      - run: echo "e2e-and-a11y is admin-web-scoped (admin-ship.yml) — no-op here"

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core-nav

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: unit tests + coverage gate
        run: ./gradlew test koverVerify

      - name: semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/kotlin p/owasp-top-ten p/secrets
