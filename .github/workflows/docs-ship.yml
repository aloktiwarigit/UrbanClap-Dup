name: docs-ship

# Satisfies the required `quality-gate` status check on `main` for docs-only PRs.
# The other *-ship.yml workflows are path-filtered to their sub-projects (api/**,
# customer-app/**, etc.) and never trigger on docs/** changes — leaving docs-only
# PRs unable to satisfy branch protection without an admin override.
#
# This workflow runs on docs/** changes (and on its own file) and emits a
# `quality-gate` job whose name matches the required check, unblocking docs PRs.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ship.yml'
      # Root-level config files belong to no sub-project, so no other
      # *-ship.yml matches them either — a .gitignore-only PR could satisfy
      # no required check and stalled indefinitely (PR #331). Same deadlock
      # this workflow was created for, one filter-gap over. Widened by class
      # rather than enumerated: enumerating '.gitignore' alone left 8 other
      # root files (CLAUDE.md, TOKEN-SYNC.md, .firebaserc, firebase.json,
      # .gitattributes, .semgrepignore, .bmad-readiness-passed,
      # .codex-review-passed) able to stall exactly the same way. An Actions
      # path glob treats '*' as "any character except /", so this matches
      # root-level files only and does not swallow sub-project paths.
      - '*'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ship.yml'
      # Root-level config files belong to no sub-project, so no other
      # *-ship.yml matches them either — a .gitignore-only PR could satisfy
      # no required check and stalled indefinitely (PR #331). Same deadlock
      # this workflow was created for, one filter-gap over. Widened by class
      # rather than enumerated: enumerating '.gitignore' alone left 8 other
      # root files (CLAUDE.md, TOKEN-SYNC.md, .firebaserc, firebase.json,
      # .gitattributes, .semgrepignore, .bmad-readiness-passed,
      # .codex-review-passed) able to stall exactly the same way. An Actions
      # path glob treats '*' as "any character except /", so this matches
      # root-level files only and does not swallow sub-project paths.
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required by branch protection alongside quality-gate on every PR. admin-ship.yml
  # owns the real e2e-and-a11y job (admin-web a11y/e2e coverage, see issue #335); this
  # job is a no-op fallback so PRs that don't touch admin-web-relevant paths can still
  # satisfy the check instead of blocking forever on one that never runs for them.
  #
  # This workflow's root-level '*' trigger also matches TOKEN-SYNC.md, which is one of
  # admin-ship.yml's own trigger paths — so a TOKEN-SYNC.md-only change would fire both.
  # `admin-relevance` mirrors admin-ship.yml's `paths:` list exactly — keep both in
  # sync — and skips this no-op whenever a PR would also make the real job run, so a
  # trivial success here can never race or shadow-satisfy the required check ahead of
  # admin-ship.yml's actual a11y/e2e result (Codex P1 finding, PR #354 round 1).
  admin-relevance:
    runs-on: ubuntu-latest
    outputs:
      admin_relevant: ${{ steps.filter.outputs.admin_relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin_relevant:
              - 'admin-web/**'
              - 'design-system/src/main/kotlin/com/homeservices/designsystem/theme/Color.kt'
              - 'figma/variables.json'
              - 'TOKEN-SYNC.md'
              - 'tools/check-token-drift.py'
              - 'tools/tests/test_check_token_drift.py'
              - 'api/openapi.json'
              - 'api/src/**'

  e2e-and-a11y:
    needs: admin-relevance
    if: needs.admin-relevance.outputs.admin_relevant != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "e2e-and-a11y is admin-web-scoped (admin-ship.yml) — no-op here"

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify changed markdown files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          # On PRs the GITHUB_BASE_REF is set to the target branch (main).
          # On push to main we don't gate this — the merge already happened.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            changed_md=$(git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}"...HEAD -- 'docs/**/*.md' || true)
            if [[ -z "${changed_md}" ]]; then
              echo "No markdown files changed in this PR — nothing to validate."
              exit 0
            fi
            echo "Validating changed markdown files:"
            echo "${changed_md}"
            while IFS= read -r f; do
              if [[ ! -s "${f}" ]]; then
                echo "::error file=${f}::Markdown file is empty"
                exit 1
              fi
            done <<< "${changed_md}"
          fi
          echo "docs-only quality gate passed"
