name: api-ship

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-ship.yml'
      - 'tools/check-hindi-catalogue-parity.mjs'
      - 'customer-app/app/src/main/kotlin/com/homeservices/customer/data/catalogue/HindiLocaleNames.kt'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-ship.yml'
      - 'tools/check-hindi-catalogue-parity.mjs'
      - 'customer-app/app/src/main/kotlin/com/homeservices/customer/data/catalogue/HindiLocaleNames.kt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Required by branch protection alongside quality-gate on every PR. admin-ship.yml
  # owns the real e2e-and-a11y job (admin-web a11y/e2e coverage, see issue #335); this
  # job is a no-op fallback so PRs that don't touch admin-web-relevant paths can still
  # satisfy the check instead of blocking forever on one that never runs for them.
  #
  # admin-ship.yml ALSO triggers on 'api/openapi.json' and 'api/src/**' (the e2e suite
  # boots the API), so api-ship.yml's own trigger paths overlap with admin's real job.
  # `admin-relevance` mirrors admin-ship.yml's `paths:` list exactly — keep both in
  # sync — and skips this no-op whenever a PR would also make the real job run, so a
  # trivial success here can never race or shadow-satisfy the required check ahead of
  # admin-ship.yml's actual a11y/e2e result (Codex P1 finding, PR #354 round 1).
  admin-relevance:
    runs-on: ubuntu-latest
    outputs:
      admin_relevant: ${{ steps.filter.outputs.admin_relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin_relevant:
              - 'admin-web/**'
              - 'design-system/src/main/kotlin/com/homeservices/designsystem/theme/Color.kt'
              - 'figma/variables.json'
              - 'TOKEN-SYNC.md'
              - 'tools/check-token-drift.py'
              - 'tools/tests/test_check_token_drift.py'
              - 'api/openapi.json'
              - 'api/src/**'

  e2e-and-a11y:
    needs: admin-relevance
    if: needs.admin-relevance.outputs.admin_relevant != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "e2e-and-a11y is admin-web-scoped (admin-ship.yml) — no-op here"

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: build (clean-room compile check)
        run: pnpm build

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint --max-warnings 0

      - name: Hindi catalogue parity
        run: node ../tools/check-hindi-catalogue-parity.mjs

      - name: unit + integration tests (with coverage gate)
        run: pnpm test:coverage
        env:
          NODE_ENV: test

      - name: openapi spec quality (spectral — contract lint)
        run: pnpm run openapi:lint

      - name: semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          # `uses:` steps don't honor the job's `working-directory: api` default,
          # so the local config path is repo-relative.
          config: |
            p/typescript
            p/owasp-top-ten
            p/nodejs
            p/secrets
            api/.semgrep.yml

  openapi-sync:
    name: Auto-commit regenerated openapi.json
    runs-on: ubuntu-latest
    needs: quality-gate
    # Only push back on direct pushes to main — PRs cannot push to the PR branch from a
    # workflow and workflow_dispatch has no target branch guarantee.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: openapi spec is up to date
        run: |
          pnpm run openapi:build
          if ! git diff --exit-code openapi.json; then
            echo "::warning::api/openapi.json regenerated on CI — committing"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore(api): auto-regenerate openapi.json [skip ci]"
            git push
          fi

  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    needs: [quality-gate, openapi-sync]
    # openapi-sync is skipped on workflow_dispatch (push-only); treat skipped as success.
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      (needs.openapi-sync.result == 'success' || needs.openapi-sync.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: func-homeservices-prod
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true
      - name: Azure login
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}" \
            --output none
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      - name: Enable Oryx remote build
        run: |
          az functionapp config appsettings delete \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group rg-homeservices-prod \
            --setting-names WEBSITE_RUN_FROM_PACKAGE \
            --output none || true

          az functionapp config appsettings set \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group rg-homeservices-prod \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              NPM_CONFIG_INCLUDE=dev \
              NPM_CONFIG_PRODUCTION=false \
              NODE_ENV=production \
              AzureWebJobsFeatureFlags=EnableWorkerIndexing \
            --output none
      - name: Deploy via Oryx remote build
        # Trigger sync timeout is a known non-fatal race; remote build failures are not.
        run: |
          set +e
          func azure functionapp publish "$AZURE_FUNCTIONAPP_NAME" --javascript --build remote --verbose 2>&1 | tee /tmp/func-publish.log
          publish_status="${PIPESTATUS[0]}"
          set -e

          if grep -Eiq 'Remote build failed|Deployment Failed|No space left on device|rsync error' /tmp/func-publish.log; then
            exit 1
          fi

          if [ "$publish_status" -ne 0 ]; then
            if grep -Eiq 'sync.*trigger|trigger.*sync|timed out' /tmp/func-publish.log; then
              echo "::warning::Publish exited non-zero during trigger sync; continuing to health verification."
            else
              exit "$publish_status"
            fi
          fi
      - name: Set deployed commit
        run: |
          az functionapp config appsettings set \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group rg-homeservices-prod \
            --settings GIT_SHA="${GITHUB_SHA}" \
            --output none
      - name: List indexed functions
        continue-on-error: true
        run: |
          az functionapp function list \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group rg-homeservices-prod \
            --query "[].name" \
            -o tsv
      - name: Verify health endpoint
        run: |
          set -euo pipefail

          health_url="https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/v1/health"
          expected_commit="${GITHUB_SHA:0:8}"
          for attempt in $(seq 1 36); do
            status_code="$(curl -sS -o /tmp/api-health.json -w '%{http_code}' "$health_url" || true)"
            if [ "$status_code" = "200" ]; then
              if jq -e --arg commit "$expected_commit" '.status == "ok" and .commit == $commit' /tmp/api-health.json >/dev/null; then
                cat /tmp/api-health.json
                exit 0
              fi
              echo "Health returned 200 but not the expected commit ${expected_commit}; retrying..."
              cat /tmp/api-health.json
            else
              echo "Health check attempt ${attempt}/36 returned ${status_code}; retrying..."
            fi
            sleep 10
          done

          echo "Health endpoint did not return 200."
          cat /tmp/api-health.json || true
          exit 1
