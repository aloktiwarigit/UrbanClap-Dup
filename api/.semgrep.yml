# Karnataka Platform Workers Act 2025 — FR-9.1 data-layer enforcement.
#
# Companion enforcement layers:
#   - api/tests/integration/dispatcher-data-isolation.test.ts (runtime test gate)
#   - docs/dispatch-algorithm.md (public algorithm transparency doc)
#   - docs/adr/0011-karnataka-decline-history-isolation.md (ADR)
#
# These rules fail CI if a developer accidentally introduces decline-derived
# features into the dispatcher read path. Discipline alone is not auditable;
# CI enforcement is. `acceptRate` is forbidden because it is mathematically
# `1 - declineRate` — decline-derived even when positively framed.
#
# Path resolution: semgrep-action runs from repo root (uses: steps don't
# honor api-ship.yml's `working-directory: api`), so paths are repo-relative.
rules:
  - id: karnataka-no-decline-in-dispatcher
    pattern-either:
      - pattern: declineCount
      - pattern: declineHistory
      - pattern: declineRatio
      - pattern: pastDeclines
      - pattern: declined_in_last
      - pattern: rejectionCount
      - pattern: rejectionHistory
      - pattern: acceptRate
      - pattern: acceptanceRate
      - pattern: $X["declineCount"]
      - pattern: $X['declineCount']
      - pattern: $X["declineHistory"]
      - pattern: $X['declineHistory']
      - pattern: $X["declineRatio"]
      - pattern: $X['declineRatio']
      - pattern: $X["pastDeclines"]
      - pattern: $X['pastDeclines']
      - pattern: $X["declined_in_last"]
      - pattern: $X['declined_in_last']
      - pattern: $X["rejectionCount"]
      - pattern: $X['rejectionCount']
      - pattern: $X["acceptRate"]
      - pattern: $X['acceptRate']
      - pattern: $X["acceptanceRate"]
      - pattern: $X['acceptanceRate']
    paths:
      include:
        - "api/src/services/dispatcher.service.ts"
        - "api/src/cosmos/technician-repository.ts"
        - "api/src/cosmos/dispatch-attempt-repository.ts"
        - "api/src/schemas/technician.ts"
        - "api/src/schemas/dispatch-attempt.ts"
    message: |
      Decline history must not influence dispatch ranking
      (Karnataka Platform Workers Act 2025, FR-9.1, NFR-C-1).
      Reverse this change or revise docs/adr/0011-karnataka-decline-history-isolation.md
      with explicit owner approval.
    languages: [typescript]
    severity: ERROR

  # E11-S02 — FCM ordering invariant for pending-action projectors.
  #
  # In any trigger-projector-*.ts file, sendFcm (emitFcmForAction) MUST be
  # called AFTER upsertAction. This rule catches the inverted call order:
  # emitFcmForAction(...) appearing BEFORE upsertAction(...) in the same
  # function body.
  #
  # The correct pattern is:
  #   const { doc } = await upsertAction(...);
  #   await emitFcmForAction(doc, ...);   // <-- always second
  #
  # References: E11 spec §S02, docs/stories/E11-S02-backend-pending-actions.md
  - id: pending-action-fcm-ordering
    patterns:
      - pattern: |
          async function $FUNC(...) {
            ...
            await emitFcmForAction(...);
            ...
            await upsertAction(...);
            ...
          }
      - pattern-not: |
          async function $FUNC(...) {
            ...
            await upsertAction(...);
            ...
            await emitFcmForAction(...);
            ...
          }
    paths:
      include:
        - "api/src/functions/trigger-projector-*.ts"
    message: |
      FCM send MUST happen after upsertAction in projector files (E11-S02 ordering invariant).
      emitFcmForAction() is called before upsertAction() in $FUNC.
      Fix: await upsertAction(...) first, then await emitFcmForAction(...).
      See: docs/stories/E11-S02-backend-pending-actions.md
    languages: [typescript]
    severity: ERROR

  # E19-S02 — FCM PII trim: ban user-specific topic sends.
  #
  # Customer and technician UIDs in FCM topic names are PII under DPDP Act 2023.
  # Any topic of the form `customer_<uid>` or `technician_<uid>` broadcasts the
  # subscriber's identity to anyone subscribed to that topic, violating data
  # minimisation (DPDP §5) and purpose limitation (DPDP §6).
  #
  # Use device-token sends (sendToUserTokens helper in fcm.service.ts) instead.
  # The only approved topic exception is the non-PII `owner_alerts` aggregate
  # topic — see ADR-0026 §5.
  #
  # References: docs/adr/0026-fcm-pii-trim.md, E19-S02 spec
  - id: fcm-no-user-topic-pii
    pattern-either:
      - pattern: |
          topic: `customer_${...}`
      - pattern: |
          topic: `technician_${...}`
    message: >
      FCM user-specific topics expose UIDs (PII under DPDP Act 2023 §5/§6).
      Use device-token sends via sendToUserTokens() instead. See ADR-0026.
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "api/src/**"

  - id: audit-log-immutable
    pattern-either:
      - pattern: $X.container("audit_log").items.upsert(...)
      - pattern: $X.container("audit_log").items.replace(...)
      - pattern: $X.container("audit_log").items.delete(...)
      - pattern: $X.container("audit_log").items.patch(...)
      - pattern: $X.container("audit_log").items.batch(...)
      - pattern: $X.container("audit_log").items.bulk(...)
      - pattern: $X.container("audit_log").items.executeBulkOperations(...)
      - pattern: $X.container("audit_log").item($Y, $Z).replace(...)
      - pattern: $X.container("audit_log").item($Y, $Z).delete(...)
      - pattern: $X.container("audit_log").item($Y, $Z).patch(...)
    paths:
      include:
        - "api/src/**/*.ts"
    message: |
      Audit log entries must NOT be mutated or deleted (FR-9.4, DPDP Act 2023 §8).
      The audit_log container is append-only by design. Reverse this change or open
      an ADR with explicit owner approval.
    languages: [typescript]
    severity: ERROR

  # E19-S03 — Cross-partition query injection guard.
  #
  # Bans Cosmos query strings that directly interpolate expressions via
  # template-literal ${...} syntax. All filter values MUST be passed through
  # the parameterised `parameters: [{ name: '@param', value: ... }]` array.
  # Template-literal interpolation into a Cosmos SQL string can produce
  # malformed queries even when the Cosmos NoSQL engine handles characters
  # differently from relational SQL — and it makes code-review harder.
  #
  # Safe pattern:
  #   items.query({ query: 'SELECT * FROM c WHERE c.id = @id', parameters: [...] })
  #
  # Unsafe pattern (caught by this rule):
  #   items.query({ query: `SELECT * FROM c WHERE c.id = '${userId}'` })
  #
  # See docs/adr/0027-cross-partition-query-guardrails.md.
  - id: no-user-controlled-cosmos-query
    pattern-either:
      - pattern: "$C.items.query({query: `...${...}...`, ...})"
      - pattern: "$C.items.query(`...${...}...`, ...)"
    paths:
      include:
        - "**/api/src/**/*.ts"
    message: |
      Direct template-literal interpolation into a Cosmos SQL query string.
      Use parameterised queries instead:
        query: 'SELECT * FROM c WHERE c.field = @param',
        parameters: [{ name: '@param', value: userInput }]
      See docs/adr/0027-cross-partition-query-guardrails.md.
    languages: [typescript]
    severity: ERROR

  # E19-S03 — Cross-partition query tenant-filter guard (WARNING).
  #
  # Flags any .items.query() call in the Cosmos repository layer that executes
  # WITHOUT an explicit partitionKey option, i.e. a cross-partition fan-out.
  # Today all such calls are bounded by RBAC at the calling Azure Function layer.
  # The risk: a future endpoint that forwards user-controlled filters into one of
  # these helpers without first checking the caller's claim exposes other
  # partitions' data.
  #
  # This rule fires on ALL existing cross-partition helpers by design — they
  # carry // SEMGREP-JUSTIFIED: comments explaining the caller-scope guarantee.
  # New cross-partition queries in these files must add the same justification
  # or restructure to pass partitionKey.
  #
  # Severity is WARNING (not ERROR) so existing justified helpers don't break CI;
  # violations appear as PR annotations.
  #
  # Known Semgrep limitation: this pattern does NOT fire on methods defined with
  # concise object-method syntax (e.g. ratingRepo.getAllByTechnicianId in
  # rating-repository.ts). Those helpers are guarded by Layer 3 (static coverage
  # test in tests/cosmos/cross-partition-tenant-filter.test.ts) instead.
  # See docs/adr/0027-cross-partition-query-guardrails.md.
  - id: cross-partition-query-must-have-tenant-filter
    patterns:
      - pattern: "$C.items.query(...)"
      - pattern-not: "$C.items.query($Q, {partitionKey: $_, ...})"
    paths:
      include:
        - "**/api/src/cosmos/complaints-repository.ts"
        - "**/api/src/cosmos/audit-log-repository.ts"
        - "**/api/src/cosmos/rating-repository.ts"
    message: |
      Cross-partition Cosmos query without an explicit partitionKey option.
      Today bounded by RBAC at the calling Function layer.
      Risk: a future endpoint forwarding user-controlled filters without
      caller-claim checks exposes other partitions' data.
      Either pass { partitionKey: ... } as the second argument, or add a
      // SEMGREP-JUSTIFIED: comment above the function explaining the
      caller-scope guarantee.
      See docs/adr/0027-cross-partition-query-guardrails.md.
    languages: [typescript]
    # INFO (not WARNING) — semgrep-action@v1 treats any finding as blocking, but
    # this rule is intentionally informational on the 3 admin-scope repository
    # files. The defence-in-depth comes from the static coverage test in
    # tests/cosmos/cross-partition-tenant-filter.test.ts which actually asserts
    # the caller-side middleware imports. INFO surfaces the finding in dashboards
    # without blocking prod deploys (regression on 2026-05-18 — both api-ship
    # main pushes after E19-S01 + E19-S02 merges failed on this exact rule).
    severity: INFO
