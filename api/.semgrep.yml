# Karnataka Platform Workers Act 2025 — FR-9.1 data-layer enforcement.
#
# Companion enforcement layers:
#   - api/tests/integration/dispatcher-data-isolation.test.ts (runtime test gate)
#   - docs/dispatch-algorithm.md (public algorithm transparency doc)
#   - docs/adr/0011-karnataka-decline-history-isolation.md (ADR)
#
# These rules fail CI if a developer accidentally introduces decline-derived
# features into the dispatcher read path. Discipline alone is not auditable;
# CI enforcement is. `acceptRate` is forbidden because it is mathematically
# `1 - declineRate` — decline-derived even when positively framed.
#
# Path resolution: semgrep-action runs from repo root (uses: steps don't
# honor api-ship.yml's `working-directory: api`), so paths are repo-relative.
rules:
  - id: karnataka-no-decline-in-dispatcher
    pattern-either:
      - pattern: declineCount
      - pattern: declineHistory
      - pattern: declineRatio
      - pattern: pastDeclines
      - pattern: declined_in_last
      - pattern: rejectionCount
      - pattern: rejectionHistory
      - pattern: acceptRate
      - pattern: acceptanceRate
      - pattern: $X["declineCount"]
      - pattern: $X['declineCount']
      - pattern: $X["declineHistory"]
      - pattern: $X['declineHistory']
      - pattern: $X["declineRatio"]
      - pattern: $X['declineRatio']
      - pattern: $X["pastDeclines"]
      - pattern: $X['pastDeclines']
      - pattern: $X["declined_in_last"]
      - pattern: $X['declined_in_last']
      - pattern: $X["rejectionCount"]
      - pattern: $X['rejectionCount']
      - pattern: $X["acceptRate"]
      - pattern: $X['acceptRate']
      - pattern: $X["acceptanceRate"]
      - pattern: $X['acceptanceRate']
    paths:
      include:
        - "api/src/services/dispatcher.service.ts"
        - "api/src/cosmos/technician-repository.ts"
        - "api/src/cosmos/dispatch-attempt-repository.ts"
        - "api/src/schemas/technician.ts"
        - "api/src/schemas/dispatch-attempt.ts"
    message: |
      Decline history must not influence dispatch ranking
      (Karnataka Platform Workers Act 2025, FR-9.1, NFR-C-1).
      Reverse this change or revise docs/adr/0011-karnataka-decline-history-isolation.md
      with explicit owner approval.
    languages: [typescript]
    severity: ERROR

  # E21-S04 / ADR-0032 — commission hold is an ELIGIBILITY FILTER, never a ranking input.
  #
  # Same principle as karnataka-no-decline-in-dispatcher above, different field. A technician
  # who owes commission may be excluded from the candidate set; they must never be sorted
  # lower within it. Ranking is distance, then rating. Nothing else.
  #
  # Companion enforcement:
  #   - api/tests/unit/dispatch-ranking-invariance.test.ts (runtime gate)
  #   - api/src/services/dispatch-eligibility.ts (structural: the only hold-aware module)
  #   - docs/adr/0032-commission-hold-is-an-eligibility-gate.md
  #
  # Note: semgrep-action@v1 treats every finding as blocking regardless of declared severity
  # (see the comment in api/tests/cosmos/cross-partition-tenant-filter.test.ts). That is the
  # intended behaviour for this rule.
  - id: no-commission-hold-in-ranking
    # History of this rule's pattern shapes (both fixes verified against local semgrep
    # 1.159.0 with synthetic violations, before and after each change):
    #
    # 1. The first draft used single-line `{ ... $X.f ... }` / `=> ... $X.f ...` forms.
    #    Those are rejected by this semgrep version's TypeScript parser
    #    (Stdlib.Parsing.Parse_error) and, with --error, that fails the WHOLE rule (exit 2),
    #    not just the offending pattern.
    #
    # 2. Reformatting to multi-line `{ ... }` blocks fixed the parser, but the embedded
    #    `$X.field` ellipsis-body form only matches when the field reference is itself the
    #    (sub-expression of a) top-level statement in the block — e.g. `return
    #    a.commissionHold - b.commissionHold`. It does NOT match a hold reference buried
    #    inside an if-condition, e.g. `if (a.commissionHold?.state === 'BLOCKED') return 1;`
    #    — which is the single most natural way to write a "BLOCKED-last" tiebreaker. That
    #    gap was verified empirically: the block-ellipsis form produced 0 findings against
    #    such a snippet where a plain arithmetic return produced 1.
    #
    # The rule below uses `pattern-inside` (find the ranking function/comparator) combined
    # with a bare field-access `pattern-either` (`$X.commissionHold` etc., which — used on
    # its own outside a block-ellipsis body — matches the field reference at ANY nesting
    # depth: if-conditions, ternaries, boolean expressions, everywhere) instead. Verified to
    # catch the if-condition tiebreaker shape above, the plain-arithmetic shape, and the
    # concise (no-braces) arrow-body shape, in both `rankTechnicians` and
    # `getTechnicianCandidatesForBooking`, while staying at 0 findings against the current
    # tree.
    #
    # api/src/cosmos/technician-repository.ts IS in scope (see paths.include below) because
    # it hosts getTechnicianCandidatesForBooking() (~line 398), a second, independent copy of
    # the Karnataka comparator (distanceKm, then rating) that ranks getTechniciansWithinRadius
    # output for admin manual-assignment (src/functions/admin/orders/candidates.ts). That IS
    # dispatch ranking through another door, and its comparator is an ordinary AST sort shape
    # these patterns match perfectly — it is not SQL text and was not "impossible to cover".
    # The one exclusion is listTechniciansWithHold() (~line 677, Task 10 admin roster
    # listing), which legitimately sorts by outstandingPaise for an unrelated admin display —
    # suppressed below via pattern-not-inside rather than by dropping the whole file from
    # scope. listAllTechniciansWithHold() (~line 684) does not sort and is unaffected either
    # way.
    #
    # 3. Codex review (E21-S04 round 1) flagged that the field-access pattern-either lists only
    #    covered dot-access (`$X.commissionHold`), so `tech['commissionHold']`,
    #    `tech["outstandingPaise"]`, or a derived `holdState` alias slipped past the rule
    #    entirely. Each of the 4 `pattern-either` lists below now also carries both
    #    bracket-quote forms and `holdState` for all four field names (dot + `'...'` + `"..."`,
    #    12 patterns per list). Every added pattern is a bare standalone-expression pattern —
    #    the same shape as the original `$X.commissionHold` entries — never a single-line
    #    `{ ... }`/`=> ...` ellipsis-block form, so none of it revives the Stdlib.Parsing.Parse_error
    #    from fix #1 above. Verified against semgrep 1.159.0 with synthetic violations for: dot
    #    access in `rankTechnicians`, `['commissionHold']`, `["outstandingPaise"]`, a bare
    #    `holdState` reference, and inside a `.sort()` comparator — see
    #    `docs/reviews/codex-e21-s04-20260909-0804.md` and the round-1 fix report in
    #    `.superpowers/sdd/2026-09-08-e21-s04-dues-gated-dispatch/` for the exact commands run
    #    and their output. `listTechniciansWithHold`'s legitimate `commissionHold.outstandingPaise`
    #    sort is still exempted by the same `pattern-not-inside` below.
    patterns:
      - pattern-not-inside: |
          async function listTechniciansWithHold(...) {
            ...
          }
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  function rankTechnicians(...) {
                    ...
                  }
              - pattern-either:
                  - pattern: $X.commissionHold
                  - pattern: $X.outstandingPaise
                  - pattern: $X.dueCount
                  - pattern: $X.holdState
                  - pattern: $X['commissionHold']
                  - pattern: $X["commissionHold"]
                  - pattern: $X['outstandingPaise']
                  - pattern: $X["outstandingPaise"]
                  - pattern: $X['dueCount']
                  - pattern: $X["dueCount"]
                  - pattern: $X['holdState']
                  - pattern: $X["holdState"]
          - patterns:
              - pattern-inside: |
                  $A.sort((...) => {
                    ...
                  })
              - pattern-either:
                  - pattern: $X.commissionHold
                  - pattern: $X.outstandingPaise
                  - pattern: $X.dueCount
                  - pattern: $X.holdState
                  - pattern: $X['commissionHold']
                  - pattern: $X["commissionHold"]
                  - pattern: $X['outstandingPaise']
                  - pattern: $X["outstandingPaise"]
                  - pattern: $X['dueCount']
                  - pattern: $X["dueCount"]
                  - pattern: $X['holdState']
                  - pattern: $X["holdState"]
          - patterns:
              - pattern-inside: |
                  $A.sort(function (...) {
                    ...
                  })
              - pattern-either:
                  - pattern: $X.commissionHold
                  - pattern: $X.outstandingPaise
                  - pattern: $X.dueCount
                  - pattern: $X.holdState
                  - pattern: $X['commissionHold']
                  - pattern: $X["commissionHold"]
                  - pattern: $X['outstandingPaise']
                  - pattern: $X["outstandingPaise"]
                  - pattern: $X['dueCount']
                  - pattern: $X["dueCount"]
                  - pattern: $X['holdState']
                  - pattern: $X["holdState"]
          - patterns:
              - pattern-inside: |
                  $A.sort((...) => $BODY)
              - pattern-either:
                  - pattern: $X.commissionHold
                  - pattern: $X.outstandingPaise
                  - pattern: $X.dueCount
                  - pattern: $X.holdState
                  - pattern: $X['commissionHold']
                  - pattern: $X["commissionHold"]
                  - pattern: $X['outstandingPaise']
                  - pattern: $X["outstandingPaise"]
                  - pattern: $X['dueCount']
                  - pattern: $X["dueCount"]
                  - pattern: $X['holdState']
                  - pattern: $X["holdState"]
    paths:
      include:
        - "api/src/services/dispatcher.service.ts"
        - "api/src/services/dispatch-eligibility.ts"
        - "api/src/cosmos/technician-repository.ts"
    message: |
      Commission hold state must not influence dispatch ranking — it is an eligibility
      filter only (ADR-0032, and the same principle as ADR-0011 for decline history).
      Exclude the technician from the candidate set if they are BLOCKED; never sort,
      score or order by hold state, outstanding balance or due count.
    languages: [typescript]
    severity: ERROR

  # E11-S02 — FCM ordering invariant for pending-action projectors.
  #
  # In any trigger-projector-*.ts file, sendFcm (emitFcmForAction) MUST be
  # called AFTER upsertAction. This rule catches the inverted call order:
  # emitFcmForAction(...) appearing BEFORE upsertAction(...) in the same
  # function body.
  #
  # The correct pattern is:
  #   const { doc } = await upsertAction(...);
  #   await emitFcmForAction(doc, ...);   // <-- always second
  #
  # References: E11 spec §S02, docs/stories/E11-S02-backend-pending-actions.md
  - id: pending-action-fcm-ordering
    patterns:
      - pattern: |
          async function $FUNC(...) {
            ...
            await emitFcmForAction(...);
            ...
            await upsertAction(...);
            ...
          }
      - pattern-not: |
          async function $FUNC(...) {
            ...
            await upsertAction(...);
            ...
            await emitFcmForAction(...);
            ...
          }
    paths:
      include:
        - "api/src/functions/trigger-projector-*.ts"
    message: |
      FCM send MUST happen after upsertAction in projector files (E11-S02 ordering invariant).
      emitFcmForAction() is called before upsertAction() in $FUNC.
      Fix: await upsertAction(...) first, then await emitFcmForAction(...).
      See: docs/stories/E11-S02-backend-pending-actions.md
    languages: [typescript]
    severity: ERROR

  # E19-S02 — FCM PII trim: ban user-specific topic sends.
  #
  # Customer and technician UIDs in FCM topic names are PII under DPDP Act 2023.
  # Any topic of the form `customer_<uid>` or `technician_<uid>` broadcasts the
  # subscriber's identity to anyone subscribed to that topic, violating data
  # minimisation (DPDP §5) and purpose limitation (DPDP §6).
  #
  # Use device-token sends (sendToUserTokens helper in fcm.service.ts) instead.
  # The only approved topic exception is the non-PII `owner_alerts` aggregate
  # topic — see ADR-0026 §5.
  #
  # References: docs/adr/0026-fcm-pii-trim.md, E19-S02 spec
  - id: fcm-no-user-topic-pii
    pattern-either:
      - pattern: |
          topic: `customer_${...}`
      - pattern: |
          topic: `technician_${...}`
    message: >
      FCM user-specific topics expose UIDs (PII under DPDP Act 2023 §5/§6).
      Use device-token sends via sendToUserTokens() instead. See ADR-0026.
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "api/src/**"

  - id: audit-log-immutable
    pattern-either:
      - pattern: $X.container("audit_log").items.upsert(...)
      - pattern: $X.container("audit_log").items.replace(...)
      - pattern: $X.container("audit_log").items.delete(...)
      - pattern: $X.container("audit_log").items.patch(...)
      - pattern: $X.container("audit_log").items.batch(...)
      - pattern: $X.container("audit_log").items.bulk(...)
      - pattern: $X.container("audit_log").items.executeBulkOperations(...)
      - pattern: $X.container("audit_log").item($Y, $Z).replace(...)
      - pattern: $X.container("audit_log").item($Y, $Z).delete(...)
      - pattern: $X.container("audit_log").item($Y, $Z).patch(...)
    paths:
      include:
        - "api/src/**/*.ts"
    message: |
      Audit log entries must NOT be mutated or deleted (FR-9.4, DPDP Act 2023 §8).
      The audit_log container is append-only by design. Reverse this change or open
      an ADR with explicit owner approval.
    languages: [typescript]
    severity: ERROR

  # E19-S03 — Cross-partition query injection guard.
  #
  # Bans Cosmos query strings that directly interpolate expressions via
  # template-literal ${...} syntax. All filter values MUST be passed through
  # the parameterised `parameters: [{ name: '@param', value: ... }]` array.
  # Template-literal interpolation into a Cosmos SQL string can produce
  # malformed queries even when the Cosmos NoSQL engine handles characters
  # differently from relational SQL — and it makes code-review harder.
  #
  # Safe pattern:
  #   items.query({ query: 'SELECT * FROM c WHERE c.id = @id', parameters: [...] })
  #
  # Unsafe pattern (caught by this rule):
  #   items.query({ query: `SELECT * FROM c WHERE c.id = '${userId}'` })
  #
  # See docs/adr/0027-cross-partition-query-guardrails.md.
  - id: no-user-controlled-cosmos-query
    pattern-either:
      - pattern: "$C.items.query({query: `...${...}...`, ...})"
      - pattern: "$C.items.query(`...${...}...`, ...)"
    paths:
      include:
        - "**/api/src/**/*.ts"
    message: |
      Direct template-literal interpolation into a Cosmos SQL query string.
      Use parameterised queries instead:
        query: 'SELECT * FROM c WHERE c.field = @param',
        parameters: [{ name: '@param', value: userInput }]
      See docs/adr/0027-cross-partition-query-guardrails.md.
    languages: [typescript]
    severity: ERROR

  # E21-S01 — Cash-pilot settlement direction guard.
  #
  # The platform is cash-only in the pilot. Technicians collect cash directly;
  # the platform never holds the money. Adding a new RazorpayRouteService()
  # instantiation to the booking-completed settlement trigger without a RAZORPAY
  # paymentMethod guard would silently try to transfer money for every completed
  # cash booking — the exact bug this story fixes.
  #
  # Existing guarded instantiation is exempt via `// nosemgrep: cash-razorpay-guard`.
  # Any NEW unguarded instantiation in the trigger file will fail CI.
  #
  # References: E21-S01, docs/stories/E21-S01-cash-commission-api.md
  - id: cash-razorpay-guard
    pattern: new RazorpayRouteService()
    paths:
      include:
        - "api/src/functions/trigger-booking-completed.ts"
    message: |
      New RazorpayRouteService instantiation in the booking-completed settlement trigger.
      Ensure this is inside a `paymentMethod === 'RAZORPAY' && hasRazorpayCredentials()` guard.
      Cash bookings must NOT trigger Razorpay transfers — the tech already holds the cash.
      If this instantiation is correctly guarded, add `// nosemgrep: cash-razorpay-guard`.
      See: E21-S01, docs/stories/E21-S01-cash-commission-api.md
    languages: [typescript]
    severity: ERROR

  # E19-S03 — Cross-partition query tenant-filter guard (REMOVED 2026-05-18).
  #
  # The original WARNING-severity rule fired on all 3 existing cross-partition
  # helpers (audit-log-repository.ts, complaints-repository.ts, rating-repository.ts).
  # Lowering to INFO did NOT make it non-blocking — semgrep-action@v1 treats ANY
  # finding as blocking regardless of severity, so the rule was blocking every
  # api-ship deploy after E19-S01 + E19-S02 merged.
  #
  # Defence-in-depth IS preserved by the static coverage test in
  # tests/cosmos/cross-partition-tenant-filter.test.ts which asserts every caller
  # of a flagged helper imports an approved auth middleware. That layer catches
  # the actual regression we care about (a Function exposing cross-partition reads
  # without RBAC).
  #
  # Re-introduce this Semgrep rule when semgrep-action is upgraded to a version
  # that respects severity (or replaced with a non-blocking SARIF reporter).
  # See docs/adr/0027-cross-partition-query-guardrails.md.

  # E21-S02 — Commission ledger batch-only writes.
  #
  # All writes to commission_receivables MUST go through the transactional batch
  # helper (commissionReceivableRepo.runLedgerBatch) to ensure atomic, isolated
  # ledger mutations. Direct .items.create/upsert or .item().replace/delete/patch
  # calls bypass the batch and risk partial writes or race-condition ledger corruption.
  #
  # The commission-receivable-repository.ts helper itself (which implements the batch)
  # is exempt via paths.exclude.
  #
  # References: E21-S02 Task 3, docs/adr/0031-single-partition-commission-ledger.md
  - id: ledger-batch-only
    message: Money docs in commission_receivables must be written through commissionReceivableRepo.runLedgerBatch (single-partition transactional batch). See docs/adr/0031.
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        - "api/src/**"
      exclude:
        - "api/src/cosmos/commission-receivable-repository.ts"
    pattern-either:
      - pattern: getCommissionReceivablesContainer().items.create(...)
      - pattern: getCommissionReceivablesContainer().items.upsert(...)
      - pattern: getCommissionReceivablesContainer().item(...).replace(...)
      - pattern: getCommissionReceivablesContainer().item(...).patch(...)
      - pattern: getCommissionReceivablesContainer().item(...).delete(...)

  # E21-S02 — No incremental mutations on derived ledger figures.
  #
  # Ledger figures (remittedAmount, remainingPaise, outstandingPaise) are COMPUTED
  # absolute values based on a scan of the full ledger history — they are never
  # incremented or decremented (spec §3.2, ADR-0031 §5). Any +=/-= operation or
  # reassignment of the form `x.figure = x.figure + y` violates the invariant.
  # If you need to update a figure, recompute it absolutely in a batch mutation.
  #
  # References: E21-S02 spec §3.2, docs/adr/0031-single-partition-commission-ledger.md
  - id: no-increment-on-ledger
    message: Derived ledger figures are recomputed absolutely, never incremented (spec §3.2).
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        - "api/src/**"
    pattern-either:
      - pattern: $X.remittedAmount += $Y
      - pattern: $X.remittedAmount = $X.remittedAmount + $Y
      - pattern: $X.remainingPaise -= $Y
      - pattern: $X.outstandingPaise += $Y
      - pattern: $X.commissionHold.outstandingPaise = $X.commissionHold.outstandingPaise + $Y

  # E23-S01 / ADR-0035 — incentives are CREDIT-ONLY.
  #
  # An incentive award offsets commission the technician owes. It is never a payment TO the
  # technician. That is enforced in three independent layers:
  #   1. IncentiveAwardWriteSchema is `.strict()` — an unknown field cannot be persisted.
  #   2. api/tests/static/incentives-credit-only.test.ts (the portable gate; runs in the smoke
  #      gate and CI, and is proven against injected violations — see the story doc).
  #   3. These two rules.
  #
  # Two rule ids, not one, because a single rule cannot carry two `paths` blocks and the two
  # failure directions need different file sets. Merging them would flag `netPayable` inside
  # payout-queue.ts, where it is correct, and become a permanent false positive.
  - id: incentives-credit-only
    message: |
      Payout-shaped identifier in the incentive module. An incentive award is a CREDIT against
      commission owed, never a payment to the technician (ADR-0035, spec §7.8). If money must
      genuinely leave the platform for a technician, that is a payout story, not this one.
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        - "api/src/services/incentive.service.ts"
        - "api/src/schemas/incentive.ts"
        - "api/src/cosmos/incentive-repository.ts"
        - "api/src/functions/trigger-incentive-weekly.ts"
        - "api/src/functions/admin/incentives/*.ts"
    pattern-either:
      - pattern: payoutPaise
      - pattern: payoutAmount
      - pattern: payablePaise
      - pattern: netPayable
      - pattern: transferPaise
      - pattern: razorpayTransferId
      - pattern: new RazorpayRouteService()
      - pattern: $X["payoutPaise"]
      - pattern: $X['payoutPaise']
      - pattern: $X["netPayable"]
      - pattern: $X['netPayable']

  # E23-S01 / ADR-0035 — the mirror direction: no payout path may read an incentive award.
  - id: incentives-not-in-payout-path
    message: |
      Incentive award identifier inside a file that moves money OUT of the platform. An award
      must never reach a transfer, payout queue or settlement path (ADR-0035). The award's cost
      belongs on the P&L (cosmos/incentive-repository.ts#sumAppliedByIstDay), nowhere else.
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        - "api/src/functions/admin/finance/approve-payouts.ts"
        - "api/src/functions/admin/finance/payout-queue.ts"
        - "api/src/functions/admin/finance/weekly-aggregate.ts"
        - "api/src/functions/trigger-next-day-payout.ts"
        - "api/src/services/razorpayRoute.service.ts"
    pattern-either:
      - pattern: IncentiveAwardDoc
      - pattern: IncentiveAwardWriteSchema
      - pattern: incentiveAwardId
      - pattern: applyAward
      - pattern: incentiveRepo
      - pattern: $X.docType == "INCENTIVE_AWARD"
      - pattern: $X.docType === "INCENTIVE_AWARD"
